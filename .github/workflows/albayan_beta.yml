# This workflow installs dependencies and builds Albayan using cx-Freeze on Windows

name: Albayan_beta

on:
  push:
    branches: [ "albayan_beta" ]
  pull_request:
    branches: [ "albayan_beta" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.13 (latest patch)
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Upgrade pip and install dependencies
      shell: pwsh
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade cx-Freeze
        if (Test-Path "requirements.txt") {
            pip install -r requirements.txt
        }

    - name: Build with cx-Freeze
      shell: pwsh
      run: |
        python setup.py build

    - name: Remove markdown documentation files
      shell: pwsh
      run: |
        $docPath = "albayan_build\documentation"
        if (Test-Path $docPath) {
            Remove-Item "$docPath\UserGuide.md" -ErrorAction SilentlyContinue
            Remove-Item "$docPath\WhatsNew.md" -ErrorAction SilentlyContinue
        }

    - name: Find Inno Setup
      shell: pwsh
      run: |
        $isccPaths = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
        )

        $isccPath = $isccPaths | Where-Object {
            Test-Path $_
        } | Select-Object -First 1

        if (-not $isccPath) {
            Write-Host "Inno Setup was not found in the expected locations."
            exit 1
        }

        $version = (Get-Item $isccPath).VersionInfo.ProductVersion

        Write-Host "Inno Setup found:"
        Write-Host "Path: $isccPath"
        Write-Host "Version: $version"

        echo "ISCC_PATH=$isccPath" >> $env:GITHUB_ENV

    - name: Package with Inno Setup
      shell: pwsh
      run: |
        & "$env:ISCC_PATH" "albayan.iss"

        if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE."
        }

    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: albayan-beta-build
        path: albayan_build\AlbayanSetup.exe